name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit
        env:
          # Stub env vars so Next.js config doesn't throw at build time
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          CLERK_SECRET_KEY: sk_test_placeholder
          NEXT_PUBLIC_APP_URL: https://app.agent7even.com

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          CLERK_SECRET_KEY: sk_test_placeholder
          NEXT_PUBLIC_APP_URL: https://app.agent7even.com
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_STARTER_MONTHLY_PRICE_ID: price_placeholder
          STRIPE_STARTER_ANNUAL_PRICE_ID: price_placeholder
          STRIPE_GROWTH_MONTHLY_PRICE_ID: price_placeholder
          STRIPE_GROWTH_ANNUAL_PRICE_ID: price_placeholder
          STRIPE_PROAGENT_MONTHLY_PRICE_ID: price_placeholder
          STRIPE_PROAGENT_ANNUAL_PRICE_ID: price_placeholder
          RESEND_API_KEY: re_placeholder
          CRON_SECRET: placeholder
          OPENROUTER_API_KEY: placeholder
          ANTHROPIC_API_KEY: sk-ant-placeholder
          GOOGLE_OAUTH_CLIENT_ID: placeholder
          GOOGLE_OAUTH_CLIENT_SECRET: placeholder
          GOOGLE_SA_CLIENT_EMAIL: placeholder@placeholder.iam.gserviceaccount.com
          GOOGLE_SA_PRIVATE_KEY: placeholder
          META_APP_ID: placeholder
          META_APP_SECRET: placeholder
          NOTIFY_EMAIL: hello@agent7even.com
